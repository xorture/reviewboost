version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reviewboost_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-reviewboost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reviewboost_secret}
      POSTGRES_DB: ${DB_NAME:-reviewboost}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-reviewboost}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reviewboost_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: reviewboost_api
    env_file: .env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run start:dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: reviewboost_web
    env_file: apps/web/.env.local
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
